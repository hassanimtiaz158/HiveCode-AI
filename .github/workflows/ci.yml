name: Continuous Integration (CI)

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

jobs:
  contracts-and-backend:
    name: Contracts & Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: Fyp-coding-Assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:root@localhost:5432/Fyp-coding-Assistant
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:root@localhost:5432/Fyp-coding-Assistant_test
      JWT_SECRET: ci-test-secret-not-for-production-0123456789abcdef
      PYTHONPATH: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=root psql -h localhost -U postgres -d Fyp-coding-Assistant \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database migrations
        run: |
          if [ -f alembic.ini ]; then
            alembic upgrade head
          else
            cd backend && alembic upgrade head
          fi

      - name: Run Contract & Backend Tests
        run: |
          pytest -v

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build